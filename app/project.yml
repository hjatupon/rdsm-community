name: ROS2Studio
options:
  bundleIdPrefix: com.jatupon
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: ROS2Studio
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Logging:
    path: Packages/Logging
  Serialization:
    path: Packages/Serialization
  Transport:
    path: Packages/Transport
  MetalCore:
    path: Packages/MetalCore
  PointCloudRenderer:
    path: Packages/PointCloudRenderer
  RobotModelCore:
    path: Packages/RobotModelCore
  RobotModelRenderer:
    path: Packages/RobotModelRenderer
  ChartingCore:
    path: Packages/ChartingCore
  MessageRegistry:
    path: Packages/MessageRegistry
  URDFParser:
    path: Packages/URDFParser
  MeshLoader:
    path: Packages/MeshLoader
  TopicStore:
    path: Packages/TopicStore
  TFTree:
    path: Packages/TFTree
  ConnectionManager:
    path: Packages/ConnectionManager
  LayoutEngine:
    path: Packages/LayoutEngine
  ProfileStore:
    path: Packages/ProfileStore
  ConnectionUI:
    path: Packages/ConnectionUI
  TopicBrowserUI:
    path: Packages/TopicBrowserUI
  InspectorUI:
    path: Packages/InspectorUI
  AppShell:
    path: Packages/AppShell
  Viewer3DUI:
    path: Packages/Viewer3DUI
  LogStore:
    path: Packages/LogStore
  LogViewerUI:
    path: Packages/LogViewerUI
  RobotModelLoader:
    path: Packages/RobotModelLoader
  PublishService:
    path: Packages/PublishService
  PublishUI:
    path: Packages/PublishUI
  ServiceCallService:
    path: Packages/ServiceCallService
  ServiceCallUI:
    path: Packages/ServiceCallUI

targets:
  ROS2Studio:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ROS2Studio
    info:
      path: ROS2Studio/Info.plist
      properties:
        CFBundleName: "ROS2 Studio"
        CFBundleDisplayName: ROS2 Studio
        CFBundleIdentifier: com.jatupon.ros2studio
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        ITSAppUsesNonExemptEncryption: NO
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: ROS2Studio/ROS2Studio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: AppShell
      - package: Logging
      - package: Transport
      - package: MessageRegistry
      - package: TopicStore
      - package: TFTree
      - package: MetalCore
      - package: PointCloudRenderer
      - package: RobotModelCore
      - package: RobotModelRenderer
      - package: URDFParser
      - package: MeshLoader
      - package: ConnectionManager
      - package: LayoutEngine
      - package: ProfileStore
      - package: ConnectionUI
      - package: TopicBrowserUI
      - package: InspectorUI
      - package: Viewer3DUI
      - package: LogStore
      - package: LogViewerUI
      - package: RobotModelLoader
      - package: PublishService
      - package: PublishUI
      - package: ServiceCallService
      - package: ServiceCallUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jatupon.ros2studio
        INFOPLIST_FILE: ROS2Studio/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "ROS2 Studio App Store"
          DEVELOPMENT_TEAM: MZUPC2WYBN


name: RDSMCommunity
options:
  bundleIdPrefix: com.jatupon
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: RDSMCommunity
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Logging:
    path: Packages/Logging
  Serialization:
    path: Packages/Serialization
  Transport:
    path: Packages/Transport
  MetalCore:
    path: Packages/MetalCore
  PointCloudRenderer:
    path: Packages/PointCloudRenderer
  RobotModelCore:
    path: Packages/RobotModelCore
  RobotModelRenderer:
    path: Packages/RobotModelRenderer
  ChartingCore:
    path: Packages/ChartingCore
  MessageRegistry:
    path: Packages/MessageRegistry
  URDFParser:
    path: Packages/URDFParser
  MeshLoader:
    path: Packages/MeshLoader
  TopicStore:
    path: Packages/TopicStore
  TFTree:
    path: Packages/TFTree
  ConnectionManager:
    path: Packages/ConnectionManager
  LayoutEngine:
    path: Packages/LayoutEngine
  ProfileStore:
    path: Packages/ProfileStore
  ConnectionUI:
    path: Packages/ConnectionUI
  TopicBrowserUI:
    path: Packages/TopicBrowserUI
  InspectorUI:
    path: Packages/InspectorUI
  AppShell:
    path: Packages/AppShell
  Viewer3DUI:
    path: Packages/Viewer3DUI
  LogStore:
    path: Packages/LogStore
  LogViewerUI:
    path: Packages/LogViewerUI
  RobotModelLoader:
    path: Packages/RobotModelLoader
  PublishService:
    path: Packages/PublishService
  PublishUI:
    path: Packages/PublishUI

targets:
  RDSMCommunity:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RDSMCommunity
    info:
      path: RDSMCommunity/Info.plist
      properties:
        CFBundleName: "RDSM Community"
        CFBundleDisplayName: RDSM Community
        CFBundleIdentifier: com.jatupon.rdsm.community
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.5"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        ITSAppUsesNonExemptEncryption: NO
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: RDSMCommunity/RDSMCommunity.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: AppShell
      - package: Logging
      - package: Transport
      - package: MessageRegistry
      - package: TopicStore
      - package: TFTree
      - package: MetalCore
      - package: PointCloudRenderer
      - package: RobotModelCore
      - package: RobotModelRenderer
      - package: URDFParser
      - package: MeshLoader
      - package: ConnectionManager
      - package: LayoutEngine
      - package: ProfileStore
      - package: ConnectionUI
      - package: TopicBrowserUI
      - package: InspectorUI
      - package: Viewer3DUI
      - package: LogStore
      - package: LogViewerUI
      - package: RobotModelLoader
      - package: PublishService
      - package: PublishUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jatupon.rdsm.community
        INFOPLIST_FILE: RDSMCommunity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Direct-download (notarized) distribution — NOT Mac App Store.
          # Requires a "Developer ID Application" certificate; the build is then
          # notarized + stapled (see scripts/build-community.sh).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: MZUPC2WYBN


name: Release

# Continuous delivery for RDSM Community — pure trunk-based, Conventional Commits.
#
# On every push to main (i.e. every merge), compute the next version from commit
# history since the last release tag: a `feat:`-titled PR bumps minor, `fix:` bumps
# patch, `type!:`/a "BREAKING CHANGE" footer bumps major. Anything else (chore/docs/
# ci/refactor/...) releases nothing — this is the actual gate, not a version field.
# The version is never stored in the repo; it's injected at archive time only.
#
# PR titles MUST follow Conventional Commits (enforced by lint-pr-title.yml, a
# required check) — since merges are squashed, the PR title becomes the one commit
# this logic reads.
#
# Never runs on pull_request, so forked PRs can never reach the signing secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — required for git describe/log below

      - name: Select Xcode 26.3
        # Match the developer's local toolchain exactly (see ci.yml for why).
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Determine version and whether to release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          BASE="${LAST_TAG#v}"
          # Normalize legacy 2-component tags (v1.9) to 3-component (1.9.0).
          if [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]]; then BASE="${BASE}.0"; fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"

          BUMP=none
          BODY="$(git log "${LAST_TAG}..HEAD" --format=%B)"
          # Anchored to a real Conventional Commits footer line, not a substring
          # match anywhere in the body — a bare `grep -q "BREAKING CHANGE"` false-
          # positived on this exact commit, whose body *explains* the mechanism
          # ("...a BREAKING CHANGE footer...") without being one, and shipped a
          # bogus v2.0.0 release. Confirmed and fixed after the fact.
          if echo "$BODY" | grep -qE "^BREAKING CHANGE:"; then
            BUMP=major
          fi
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if [[ "$subject" =~ ^[a-z]+(\(.+\))?!: ]]; then
              BUMP=major
            elif [[ "$subject" =~ ^feat(\(.+\))?: ]] && [ "$BUMP" != major ]; then
              BUMP=minor
            elif [[ "$subject" =~ ^fix(\(.+\))?: ]] && [ "$BUMP" = none ]; then
              BUMP=patch
            fi
          done < <(git log "${LAST_TAG}..HEAD" --format=%s)

          case "$BUMP" in
            major) VERSION="$((MAJOR+1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            none)  VERSION="" ;;
          esac

          if [ -z "$VERSION" ]; then
            echo "No feat/fix commits since ${LAST_TAG} — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping publish."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bump: $BUMP → v$VERSION (since ${LAST_TAG})"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.gate.outputs.should_release == 'true'
        run: brew install xcodegen

      - name: Import signing certificate
        if: steps.gate.outputs.should_release == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain that lives only for this job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Generate project
        if: steps.gate.outputs.should_release == 'true'
        working-directory: app
        run: xcodegen generate --spec project.yml

      - name: Archive
        if: steps.gate.outputs.should_release == 'true'
        working-directory: app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.gate.outputs.version }}
          BUILD: ${{ steps.gate.outputs.build }}
        run: |
          set -euo pipefail
          # Signing is pinned explicitly here as well as in project.yml's Release
          # config, so a future edit to project.yml can't silently switch CI to
          # Automatic signing (which fails on a headless runner with no Xcode
          # account). Developer ID needs no provisioning profile.
          # MARKETING_VERSION/CURRENT_PROJECT_VERSION are plain Info.plist
          # substitution settings (no signing semantics) — safe to override here on
          # the command line, unlike CODE_SIGN_*/PROVISIONING_PROFILE_SPECIFIER
          # which apply to every target in the graph including SPM libraries.
          xcodebuild archive \
            -project RDSMCommunity.xcodeproj \
            -scheme RDSMCommunity \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/RDSMCommunity.xcarchive" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Upload dSYMs
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          # The archive's dSYMs are otherwise discarded when this runner is torn
          # down, which makes any future crash report from this build unsymbolicatable
          # (only raw hex offsets, no function names). Keep them so `atos` can resolve
          # a crash's app frames precisely instead of guessing from source review.
          name: dSYMs-v${{ steps.gate.outputs.version }}
          path: ${{ runner.temp }}/RDSMCommunity.xcarchive/dSYMs
          retention-days: 180

      - name: Export with Developer ID
        if: steps.gate.outputs.should_release == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RDSMCommunity.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize and staple
        if: steps.gate.outputs.should_release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/RDSMCommunity.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package
        if: steps.gate.outputs.should_release == 'true'
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.gate.outputs.version }}"
          # Stable asset name so the website's /releases/latest/download link never
          # changes; the version lives in the release title, tag, and the app itself.
          ZIP="$RUNNER_TEMP/RDSM-Community.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/RDSMCommunity.app" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<EOF
          RDSM Community v${VERSION} — signed with Developer ID and notarized by Apple, so it opens without security warnings.

          ### Install
          1. Download and unzip
          2. Drag **RDSM Community.app** to Applications
          3. Launch and connect to \`ws://<robot-host>:9090\`

          Requires macOS 15 (Sequoia) or later. No ROS installation needed on your Mac.

          ### Verify the download
          \`\`\`
          shasum -a 256 RDSM-Community.zip
          # ${SHA256}
          \`\`\`
          EOF
          # Create the tag+release from this commit and attach the stable-named asset.
          gh release create "v${VERSION}" "${{ steps.package.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "RDSM Community ${VERSION}" \
            --notes-file "$NOTES"
          echo "Published v${VERSION} (sha256 ${SHA256})"

      - name: Notify downstream (optional)
        # Generic by design: no downstream repo name, product name, or edition
        # appears in this public workflow. If secrets.DOWNSTREAM_REPO isn't
        # configured, this is a no-op.
        if: steps.gate.outputs.should_release == 'true'
        env:
          DOWNSTREAM_REPO: ${{ secrets.DOWNSTREAM_REPO }}
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DOWNSTREAM_REPO:-}" ]; then
            echo "No downstream repo configured — skipping."
            exit 0
          fi
          gh api "repos/$DOWNSTREAM_REPO/dispatches" \
            -f event_type=upstream-release \
            -f "client_payload[tag]=v${VERSION}" \
            -f "client_payload[sha]=$GITHUB_SHA"

      - name: Nothing to release
        if: steps.gate.outputs.should_release != 'true'
        run: echo "Version ${{ steps.gate.outputs.version }} is already released. No action."

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
